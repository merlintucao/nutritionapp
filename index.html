<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Nutrition Tracker</title>

<!-- iOS "Add to Home Screen" support -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nutrition">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1115">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.json">

<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <header class="topbar">
    <h1>Nutrition</h1>
    <button id="clearDayBtn" class="icon-btn" title="Clear today's log" aria-label="Clear today's log">&#128465;</button>
  </header>

  <section class="totals">
    <div class="total-card">
      <span class="total-value" id="totalCalories">0</span>
      <span class="total-label">kcal</span>
    </div>
    <div class="total-card">
      <span class="total-value" id="totalProtein">0</span>
      <span class="total-label">protein (g)</span>
    </div>
    <div class="total-card">
      <span class="total-value" id="totalFat">0</span>
      <span class="total-label">fat (g)</span>
    </div>
  </section>

  <section class="quick-add">
    <h2>Quick Add</h2>
    <div id="quickAddList" class="chip-row"></div>
  </section>

  <section class="search-section">
    <input type="search" id="searchInput" placeholder="Search foods..." autocomplete="off" autocapitalize="none">
    <div id="searchResults" class="search-results hidden"></div>
  </section>

  <section class="picker-section">
    <h2>Browse by Category</h2>
    <div class="picker-row">
      <select id="categorySelect">
        <option value="">Category…</option>
      </select>
      <select id="foodSelect" disabled>
        <option value="">Food…</option>
      </select>
    </div>

    <div id="addForm" class="add-form hidden">
      <div class="add-form-info">
        <div class="add-form-name" id="selectedFoodName"></div>
        <div class="add-form-macros" id="selectedFoodMacros"></div>
      </div>
      <div class="add-form-controls">
        <input type="number" id="quantityInput" min="0" step="any">
        <span id="quantityUnit" class="unit-label"></span>
        <button id="addFoodBtn" class="primary-btn">Add</button>
      </div>
    </div>
  </section>

  <section class="log-section">
    <h2>Today's Log</h2>
    <div id="logHeader" class="log-header hidden">
      <span class="lh-name">Food</span>
      <span>kcal</span>
      <span>Prot</span>
      <span>Fat</span>
      <span></span>
    </div>
    <ul id="logList" class="log-list"></ul>
    <p id="emptyLogMsg" class="empty-msg">Nothing logged yet today.</p>
  </section>

</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
